<main>
  <header>
    <section>
      <h1>
        <a [routerLink]="['/']">VON Development Studio</a>
      </h1>
      <h2>PrimeNG Helper</h2>
    </section>

    <section class="inline-flex items-center gap-2 my-4">
      <span>Español</span>
      <p-toggleswitch
        [(ngModel)]="isEnglish"
        (onChange)="handleLanguageChange()"
      />
      <span>English</span>
    </section>

    <p-menubar [model]="navigationBar" />
  </header>

  <von-toast />
  <von-confirm-dialog
    defaultIcon="pi pi-heart-fill"
    defaultHeader="VON Development Studio"
    defaultMessage="Are you sure you want to continue?"
    defaultAccept="Yes"
    defaultReject="No"
  />

  <div class="screen-wrapper mt-4">
    <router-outlet />
  </div>
</main>
