<p-confirmdialog [closable]="!loading" [closeOnEscape]="false">
  <ng-template
    #headless
    let-message
    let-onAccept="onAccept"
    let-onReject="onReject"
  >
    @if (message) {
    <div
      class="flex flex-col items-center p-8 bg-surface-0 dark:bg-surface-900 rounded"
    >
      <div
        class="rounded-full bg-primary text-primary-contrast inline-flex justify-center items-center h-24 w-24 -mt-20"
      >
        <i class="{{defaultIcon}} !text-5xl"></i>
      </div>

      <span class="font-bold text-2xl block mb-2 mt-6">
        {{ message.header ?? defaultHeader }}
      </span>

      <p class="m-0" innerHTML="{{ message.message ?? defaultMessage }}"></p>

      <div class="flex items-center gap-2 mt-6">
        <p-button
          [label]="message.acceptLabel ?? defaultAccept"
          severity="primary"
          (onClick)="handleAccept(onAccept, message.accept)"
          styleClass="w-32"
          [loading]="loading"
          [disabled]="loading"
        />

        <p-button
          [label]="message.rejectLabel ?? defaultReject"
          severity="primary"
          [outlined]="true"
          (onClick)="onReject()"
          styleClass="w-32"
          [disabled]="loading"
        />
      </div>
    </div>
    }
  </ng-template>
</p-confirmdialog>
