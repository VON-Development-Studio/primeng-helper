<p-toast [mode]="mode">
  <ng-template #message let-message>
    <span
      class="p-toast-message-icon {{ message.icon }}"
      [attr.data-pc-section]="'messageicon'"
    ></span>

    <div class="p-toast-message-text" [attr.data-pc-section]="'messagetext'">
      @if (message.summary) {
      <div class="p-toast-summary" [attr.data-pc-section]="'summary'">
        {{ message.summary }}
      </div>
      }
      <div class="p-toast-detail" [attr.data-pc-section]="'detail'">
        {{ message.detail }}
      </div>
    </div>
  </ng-template>
</p-toast>
