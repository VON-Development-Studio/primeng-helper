<p-toast>
  <ng-template #message let-message>
    <span
      class="p-toast-message-icon {{ message.icon }}"
      data-pc-section="messageicon"
    ></span>

    <div class="p-toast-message-text" data-pc-section="messagetext">
      @if (message.summary) {
      <div class="p-toast-summary" data-pc-section="summary">
        {{ message.summary }}
      </div>
      }
      <div class="p-toast-detail" data-pc-section="detail">
        {{ message.detail }}
      </div>
    </div>
  </ng-template>
</p-toast>
